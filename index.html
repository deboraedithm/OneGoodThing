<html lang="en">

  <title>One Good Thing — A little wonder, every day</title>
  <style>

    .empty h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.4px; color: white; }
    .empty p { margin: 0; font-size: 13px; }

    .modal { width: min(100%, 490px); max-height: min(650px, 88vh); overflow: auto; padding: 22px; border: 1px solid var(--line); border-radius: 20px; background: #131521; box-shadow: 0 30px 100px rgba(0,0,0,.55); }
    .modal-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .modal-head h2 { margin: 0; font-size: 21px; letter-spacing: -.5px; }
    .modal-head p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }

    .comment-list { display: grid; gap: 11px; padding: 20px 0; }
    .comment { padding: 12px; border: 1px solid var(--line); border-radius: 12px; color: #e4e3e9; font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
    .comment time { display: block; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .comment-empty { padding: 24px 8px; color: var(--muted); text-align: center; font-size: 13px; }
    .composer { display: grid; gap: 9px; padding-top: 15px; border-top: 1px solid var(--line); }
    .composer textarea { width: 100%; min-height: 78px; resize: vertical; padding: 11px; border: 1px solid var(--line); border-radius: 11px; outline: none; background: rgba(255,255,255,.045); color: white; font-size: 13px; }
    .composer textarea:focus { border-color: rgba(255,154,84,.65); }
    .composer .action { justify-self: end; }

    [hidden] { display: none !important; }

    body { min-height: 100dvh; display: grid; place-items: center; padding: 14px; background: radial-gradient(ellipse at 50% 42%, #202236 0%, #11121d 55%, #08090f 100%); }
    .shell { width: min(402px, calc(100vw - 28px)); height: min(852px, calc(100dvh - 28px)); min-height: 560px; padding: 9px; overflow: hidden; border: 1px solid #44444d; border-radius: 54px; background: #050507; box-shadow: 0 30px 100px rgba(0,0,0,.7), inset 0 0 0 2px #1a1a1d; }
    .screen { position: relative; display: flex; width: 100%; height: 100%; min-height: 0; flex-direction: column; overflow: hidden; border-radius: 45px; background: #090b17; }
    .status-bar { position: relative; z-index: 3; display: flex; height: 42px; min-height: 42px; align-items: center; justify-content: space-between; padding: 0 27px 0 29px; color: white; font-size: 12px; font-weight: 700; }
    .dynamic-island { position: absolute; top: 8px; left: 50%; width: 94px; height: 25px; transform: translateX(-50%); border-radius: 20px; background: #020204; }
    .status-icons { display: flex; align-items: center; gap: 5px; }

    .app-content { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
    .app-content::-webkit-scrollbar { display: none; }

    .subtitle { display: none; }
    .layout { display: flex; flex-direction: column; gap: 0; padding-bottom: 24px; }

    .photo-placeholder::before, .photo-placeholder::after { display: none; }

    .saved-card { display: flex; align-items: center; gap: 14px; padding: 10px 0; overflow: visible; border: 0; border-bottom: 1px solid rgba(255,255,255,.1); border-radius: 0; background: transparent; cursor: pointer; }
    .saved-image { width: 76px; height: 76px; min-width: 76px; border-radius: 10px; background: #222744; }
    .saved-copy { padding: 0; }

<body>
  <div class="shell">
    <div class="screen">
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span><span class="dynamic-island"></span>
        <span class="status-icons">
          <svg viewBox="0 0 20 16" fill="currentColor"><path d="M1 5.2a13.6 13.6 0 0 1 18 0l-1.5 1.7a11.3 11.3 0 0 0-15 0L1 5.2Zm3 3.2a9 9 0 0 1 12 0l-1.6 1.8a6.6 6.6 0 0 0-8.8 0L4 8.4Zm3.2 3.1a4.2 4.2 0 0 1 5.6 0L10 15l-2.8-.3Z"/></svg>
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 12.5h2v2H1zm3.1-2.7h2v4.7h-2zm3.3-2.5h2v7.2h-2zm3.3-2.6h2v9.8h-2z"/></svg>
          <svg class="battery" viewBox="0 0 24 14"><rect x="1" y="2" width="19" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M22 5v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="3" y="4" width="14" height="6" rx="1.5" fill="currentColor"/></svg>
        </span>
      </div>
      <div id="app-content" class="app-content">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c1.4 4.3 2.2 5.1 6.5 6.5-4.3 1.4-5.1 2.2-6.5 6.5-1.4-4.3-2.2-5.1-6.5-6.5 4.3-1.4 5.1-2.2 6.5-6.5Z"/><path d="m19.5 15 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2ZM4 2l.7 1.8L6.5 4.5l-1.8.7L4 7l-.7-1.8-1.8-.7 1.8-.7L4 2Z"/></svg>
        </div>

      </div>

    </header>

    <main>
      <section id="today-view">

        </div>
      </section>

      <section id="detail-view" class="detail-screen" hidden>
        <div class="native-nav">
          <button id="back-button" type="button" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            <span>Back</span>
          </button>
        </div>
        <div class="detail-content">
          <img id="detail-image" class="detail-hero" alt="">
          <div id="detail-video" class="detail-video" hidden>▶ &nbsp; Watch today's astronomy video</div>
          <p id="detail-date" class="detail-date"></p>
          <h1 id="detail-title" class="detail-title"></h1>
          <p id="detail-credit" class="detail-credit" hidden></p>
          <p id="detail-explanation" class="detail-explanation"></p>
          <div class="detail-actions">
            <button id="detail-favorite-button" class="action primary" type="button" aria-pressed="false"></button>
            <button id="detail-comments-button" class="action" type="button"></button>
          </div>
        </div>
      </section>

      <section id="saved-view" class="saved-view" hidden>
        <div class="intro">
          <h1>Saved wonders</h1>
        </div>
        <div id="saved-grid" class="saved-grid"></div>
      </section>
    </main>
      </div>
      <nav class="tab-bar" aria-label="Main navigation">
        <button id="today-tab" class="active" type="button" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c1.3 4.2 2.3 5.2 6.5 6.5-4.2 1.3-5.2 2.3-6.5 6.5-1.3-4.2-2.3-5.2-6.5-6.5 4.2-1.3 5.2-2.3 6.5-6.5Z"/><path d="m19 15 .7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15Z"/></svg>
          <span>Today</span>
        </button>
        <button id="saved-tab" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.7c0 4.4-8.8 10-8.8 10s-8.8-5.6-8.8-10A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.5Z"/></svg>
          <span>Saved<span id="saved-count"></span></span>
        </button>
      </nav>
      <div id="comments-modal" class="modal-backdrop" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div class="modal-head">
            <div><h2 id="modal-title">Comments</h2><p id="modal-subtitle"></p></div>
            <button id="close-modal" class="close" type="button" aria-label="Close comments">Done</button>
          </div>
          <div id="comment-list" class="comment-list"></div>
          <form id="comment-form" class="composer">
            <textarea id="comment-input" maxlength="1000" placeholder="Share a thought…" aria-label="Your comment" required></textarea>
            <button id="comment-post" class="action primary" type="submit" disabled>Post</button>
          </form>
        </section>
      </div>
      <div id="toast" class="toast" role="status" hidden></div>
    </div>
  </div>

  <script>
    (() => {
      const API_KEY = "DEMO_KEY";
      const STORAGE_KEY = "one-good-thing.browser-library.v1";
      const $ = (id) => document.getElementById(id);
      const state = { photo: null, detailPhoto: null, photos: {}, view: "today", toastTimer: null };
      const icon = {
        heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.7c0 4.4-8.8 10-8.8 10s-8.8-5.6-8.8-10A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.5Z"/></svg>',
        heartFill: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 8.7c0 4.4-8.8 10-8.8 10s-8.8-5.6-8.8-10A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.5Z"/></svg>',
        comment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg>'
      };

      function readLibrary() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          state.photos = parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
        } catch {
          state.photos = {};
          showToast("Saved items could not be read in this browser.");
        }
      }

      function saveLibrary() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.photos));
          updateSavedCount();
          return true;
        } catch {
          showToast("Couldn't save. Check your browser's storage settings.");
          return false;
        }
      }

      function entryFor(photo) {
        return state.photos[photo.date] || { photo, favorite: false, comments: [] };
      }

      function savePhotoRecord(photo, entry) {
        state.photos[photo.date] = { photo, favorite: Boolean(entry.favorite), comments: entry.comments || [] };
        return saveLibrary();
      }

      function updateSavedCount() {
        const count = Object.values(state.photos).filter((entry) => entry.favorite).length;
        $("saved-count").textContent = count ? ` · ${count}` : "";
      }

      function formatDate(dateString) {
        const date = new Date(`${dateString}T12:00:00`);
        return new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }).format(date);
      }

      function setError(message) {
        $("loading").hidden = true;
        $("photo-layout").hidden = true;
        $("error").hidden = false;
        $("error-message").textContent = message;
      }

      function renderPhoto(photo) {
        state.photo = photo;
        state.detailPhoto = null;
        $("loading").hidden = true;
        $("error").hidden = true;
        $("photo-layout").hidden = false;
        $("photo-title").textContent = photo.title;
        $("photo-card-title").textContent = photo.title;
        $("photo-date").textContent = photo.date;
        $("photo-date").dateTime = photo.date;
        $("photo-description").textContent = photo.explanation;

        const imageURL = photo.media_type === "video" ? photo.thumbnail_url : (photo.hdurl || photo.url);
        const image = $("photo-image");
        const placeholder = $("photo-placeholder");
        image.hidden = true;
        placeholder.hidden = false;
        image.onerror = () => {
          image.hidden = true;
          placeholder.hidden = false;
        };
        image.onload = () => {
          image.hidden = false;
          placeholder.hidden = true;
        };
        if (imageURL && photo.media_type !== "other") {
          image.src = imageURL;
          image.alt = photo.title;
        }
        updateActions();
        savePhotoRecord(photo, entryFor(photo));
      }

      function openDetail(photo) {
        state.detailPhoto = photo;
        $("today-view").hidden = true;
        $("saved-view").hidden = true;
        $("detail-view").hidden = false;
        $("app-content").scrollTop = 0;

        const image = $("detail-image");
        const video = $("detail-video");
        const imageURL = photo.media_type === "video" ? photo.thumbnail_url : (photo.hdurl || photo.url);
        video.hidden = photo.media_type === "image";
        image.hidden = photo.media_type !== "image";
        if (photo.media_type === "image") {
          image.src = imageURL;
          image.alt = photo.title;
          image.onerror = () => { image.hidden = true; };
        } else {
          video.onclick = () => window.open(photo.url, "_blank", "noopener");
        }

        $("detail-date").textContent = photo.date;
        $("detail-title").textContent = photo.title;
        $("detail-explanation").textContent = photo.explanation;
        const credit = photo.copyright ? `Image: ${photo.copyright.trim()}` : "";
        $("detail-credit").textContent = credit;
        $("detail-credit").hidden = !credit;
        updateActions();
      }

      function returnToTab() {
        $("detail-view").hidden = true;
        selectView(state.view);
      }

      async function loadArchiveFeature() {
        const url = new URL("https://images-api.nasa.gov/search");
        url.search = new URLSearchParams({ q: "nebula", media_type: "image", page_size: "5" });
        const response = await fetch(url);
        if (!response.ok) throw new Error("NASA's image archive is unavailable.");
        const result = await response.json();
        const item = result.collection?.items?.find((candidate) =>
          candidate.data?.[0]?.title
          && candidate.data[0].title !== "NASA Science"
          && candidate.links?.some((link) => link.render === "image")
        );
        if (!item) throw new Error("NASA's image archive did not return a photo.");
        const metadata = item.data[0];
        const imageURL = item.links.find((link) => link.render === "image").href;
        return {
          date: metadata.date_created?.slice(0, 10) || new Date().toISOString().slice(0, 10),
          title: metadata.title,
          explanation: metadata.description_508 || metadata.description || "A glimpse into our universe, from NASA's image archive.",
          url: imageURL,
          hdurl: imageURL,
          media_type: "image",
          copyright: metadata.secondary_creator || metadata.center || "NASA",
          source: "archive"
        };
      }

      async function loadToday() {
        $("error").hidden = true;
        $("photo-layout").hidden = true;
        $("loading").hidden = false;
        try {
          const date = new Intl.DateTimeFormat("en-CA", {
            year: "numeric", month: "2-digit", day: "2-digit", timeZone: "UTC"
          }).format(new Date());
          const url = new URL("https://api.nasa.gov/planetary/apod");
          url.search = new URLSearchParams({ api_key: API_KEY, date, thumbs: "true" });
          const response = await fetch(url);
          let photo = null;
          if (response.ok) {
            const result = await response.json();
            if (result.title && result.title !== "NASA Science" && result.date && result.explanation && result.url
              && !result.url.includes("/nasa-logo")) {
              photo = result;
            }
          }
          if (!photo) photo = await loadArchiveFeature();
          renderPhoto(photo);
        } catch (error) {
          setError(error instanceof TypeError
            ? "We couldn't connect to NASA. Check your internet connection and try again."
            : `${error.message || "We couldn't load today's photo."} Try again in a little while.`);
        }
      }

      function updateActions() {
        const photo = state.detailPhoto || state.photo;
        if (!photo) return;
        const entry = entryFor(photo);
        const favorite = $("detail-favorite-button");
        favorite.classList.toggle("saved", entry.favorite);
        favorite.setAttribute("aria-pressed", String(entry.favorite));
        favorite.innerHTML = `<span>${icon.heartFill}</span><span>${entry.favorite ? "Saved" : "Favorite"}</span>`;
        $("detail-comments-button").innerHTML = `${icon.comment}<span>Comments</span>`;
      }

      function showToast(message) {
        const toast = $("toast");
        toast.textContent = message;
        toast.hidden = false;
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => { toast.hidden = true; }, 2500);
      }

      function selectView(view) {
        state.view = view;
        const today = view === "today";
        $("detail-view").hidden = true;
        $("today-view").hidden = !today;
        $("saved-view").hidden = today;
        $("today-tab").classList.toggle("active", today);
        $("saved-tab").classList.toggle("active", !today);
        if (today) {
          $("today-tab").setAttribute("aria-current", "page");
          $("saved-tab").removeAttribute("aria-current");
        } else {
          $("saved-tab").setAttribute("aria-current", "page");
          $("today-tab").removeAttribute("aria-current");
          renderSaved();
        }
      }

      function renderSaved() {
        updateSavedCount();
        const grid = $("saved-grid");
        grid.replaceChildren();
        const entries = Object.values(state.photos).filter((entry) => entry.favorite)
          .sort((a, b) => b.photo.date.localeCompare(a.photo.date));
        if (!entries.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.innerHTML = '<div class="empty-icon">♡</div><h2>No saved wonders yet</h2><p>Tap the heart on a daily photo to keep it here.</p>';
          grid.append(empty);
          return;
        }
        for (const entry of entries) {
          const card = document.createElement("article");
          card.className = "saved-card";
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.setAttribute("aria-label", `Open ${entry.photo.title}`);
          card.addEventListener("click", () => openDetail(entry.photo));
          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openDetail(entry.photo);
            }
          });
          const imageFrame = document.createElement("div");
          imageFrame.className = "saved-image";
          imageFrame.innerHTML = '<div class="photo-placeholder" aria-hidden="true"></div>';
          const imageURL = entry.photo.media_type === "video" ? entry.photo.thumbnail_url : (entry.photo.hdurl || entry.photo.url);
          if (imageURL) {
            const image = document.createElement("img");
            image.src = imageURL;
            image.alt = "";
            image.loading = "lazy";
            image.onerror = () => image.remove();
            imageFrame.append(image);
          }
          const copy = document.createElement("div");
          copy.className = "saved-copy";
          const title = document.createElement("h3");
          title.textContent = entry.photo.title;
          const date = document.createElement("p");
          date.textContent = formatDate(entry.photo.date);
          copy.append(title, date);
          if (entry.comments.length) {
            const comments = document.createElement("p");
            comments.className = "comment-count";
            comments.textContent = `${entry.comments.length} comment${entry.comments.length === 1 ? "" : "s"}`;
            copy.append(comments);
          }
          card.append(imageFrame, copy);
          grid.append(card);
        }
      }

      function renderComments() {
        const photo = state.detailPhoto || state.photo;
        if (!photo) return;
        const entry = entryFor(photo);
        $("modal-subtitle").textContent = photo.title;
        const list = $("comment-list");
        list.replaceChildren();
        if (!entry.comments.length) {
          const empty = document.createElement("div");
          empty.className = "comment-empty";
          empty.innerHTML = '<div class="empty-icon">☷</div><h2>Start the conversation</h2><p>Add a thought about today’s discovery.</p>';
          list.append(empty);
          return;
        }
        for (const comment of entry.comments) {
          const item = document.createElement("div");
          item.className = "comment";
          const text = document.createElement("div");
          text.textContent = comment.text;
          const time = document.createElement("time");
          time.dateTime = comment.createdAt;
          time.textContent = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(new Date(comment.createdAt));
          item.append(text, time);
          list.append(item);
        }
      }

      $("today-tab").addEventListener("click", () => selectView("today"));
      $("saved-tab").addEventListener("click", () => selectView("saved"));
      $("open-detail").addEventListener("click", () => {
        if (state.photo) openDetail(state.photo);
      });
      $("discover-link").addEventListener("click", () => {
        if (state.photo) openDetail(state.photo);
      });
      $("back-button").addEventListener("click", returnToTab);
      $("retry").addEventListener("click", loadToday);
      $("detail-favorite-button").addEventListener("click", () => {
        const photo = state.detailPhoto;
        if (!photo) return;
        const entry = entryFor(photo);
        entry.favorite = !entry.favorite;
        savePhotoRecord(photo, entry);
        updateActions();
        if (state.view === "saved") renderSaved();
      });
      $("detail-comments-button").addEventListener("click", () => {
        renderComments();
        $("comments-modal").hidden = false;
        $("comment-input").focus();
      });
      $("close-modal").addEventListener("click", () => { $("comments-modal").hidden = true; });
      $("comments-modal").addEventListener("click", (event) => {
        if (event.target === $("comments-modal")) $("comments-modal").hidden = true;
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") $("comments-modal").hidden = true;
      });
      $("comment-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const photo = state.detailPhoto;
        if (!photo) return;
        const text = $("comment-input").value.trim();
        if (!text) return;
        const entry = entryFor(photo);
        entry.comments.push({ text, createdAt: new Date().toISOString() });
        if (!savePhotoRecord(photo, entry)) return;
        $("comment-input").value = "";
        $("comment-post").disabled = true;
        renderComments();
        updateActions();
      });
      $("comment-input").addEventListener("input", (event) => {
        $("comment-post").disabled = !event.currentTarget.value.trim();
      });

      readLibrary();
      updateSavedCount();
      loadToday();
    })();
  </script>
</body>
</html>
